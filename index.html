<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ACA U18 — Suivi de saison</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.4/dist/chart.umd.js"></script>
<style>
  :root{
    --bg:#F1F3EE;
    --panel:#FFFFFF;
    --ink:#14181A;
    --ink-soft:#4B5450;
    --pitch:#1E5631;
    --pitch-light:#3F8351;
    --brick:#A93F2B;
    --line:#D8D9D2;
    --line-strong:#B9BCB3;
    --gk:#2B5C8A;
    --renfort:#B8860B;
    --extra:#EFEAD9;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--bg);
    color:var(--ink);
    font-family:'Inter',system-ui,sans-serif;
    font-size:15px;
    line-height:1.5;
    -webkit-font-smoothing:antialiased;
  }
  h1,h2,h3,.num,.tab-btn,.scoreboard .big{
    font-family:'Oswald',sans-serif;
    font-weight:600;
    letter-spacing:0.01em;
  }
  a{color:var(--pitch);}

  /* ---------- Masthead ---------- */
  header.masthead{
    background:var(--ink);
    color:#fff;
    padding:12px 20px;
  }
  .masthead-inner{
    max-width:980px;
    margin:0 auto;
    display:flex;
    align-items:center;
    justify-content:space-between;
    flex-wrap:wrap;
    gap:12px;
  }
  .masthead-row2{
    max-width:980px;
    margin:10px auto 0;
    display:flex;
    align-items:center;
    justify-content:space-between;
    flex-wrap:wrap;
    gap:10px;
  }
  .selector-groups{display:flex;gap:16px;align-items:center;flex-wrap:wrap;}
  .home-hero{text-align:center;padding:12px 0 20px;}
  .home-banner{width:100%;max-width:920px;border-radius:8px;display:block;margin:0 auto 28px;box-shadow:0 4px 18px rgba(0,0,0,0.18);}
  .home-text h2{font-family:'Oswald',sans-serif;font-size:25px;margin:0 0 16px;color:var(--ink);}
  .home-text p{font-size:16px;color:var(--ink-soft);max-width:720px;margin:0 auto 10px;line-height:1.65;}
  .match-sheet-links{display:flex;gap:14px;justify-content:center;flex-wrap:wrap;max-width:820px;margin:0 auto;}
  .match-sheet-link{
    display:flex;align-items:center;gap:10px;padding:14px 20px;
    background:var(--panel);border:1px solid var(--line);border-radius:6px;
    text-decoration:none;color:var(--ink);font-family:'Inter',sans-serif;font-size:14px;font-weight:600;
    transition:border-color .15s,box-shadow .15s;min-width:170px;
  }
  .match-sheet-link:hover{border-color:var(--pitch-light);box-shadow:0 2px 8px rgba(0,0,0,0.08);}
  .match-sheet-link .msl-icon{font-size:20px;}
  .team-tabs{display:flex;gap:4px;background:rgba(255,255,255,0.08);padding:4px;border-radius:6px;}
  .team-tab-btn{
    background:transparent;border:1px solid transparent;color:#C6CCC7;
    padding:8px 16px;font-size:13px;font-family:'Oswald',sans-serif;font-weight:600;
    text-transform:uppercase;letter-spacing:0.04em;cursor:pointer;border-radius:4px;
    transition:background .15s,color .15s;
  }
  .team-tab-btn:hover{color:#fff;}
  .team-tab-btn.active{background:var(--pitch-light);color:#fff;}
  .brand{
    display:flex;
    align-items:center;
    gap:12px;
  }
  .crest{
    width:40px;height:40px;border-radius:50%;
    background:#fff;
    display:flex;align-items:center;justify-content:center;
    font-family:'Oswald',sans-serif;font-weight:700;font-size:13px;color:var(--ink);
    flex:none;
    border:2px solid #fff;
  }
  .brand-text h1{
    margin:0;
    font-size:17px;
    text-transform:uppercase;
    letter-spacing:0.04em;
    color:#fff;
  }
  .brand-text p{
    margin:1px 0 0;
    font-size:12.5px;
    color:#B9C3BC;
    font-family:'Inter',sans-serif;
  }
  .tabs-wrap{display:flex;align-items:center;gap:10px;background:rgba(255,255,255,0.04);padding:6px 10px;border:1px solid #3A423E;border-radius:6px;}
  .tabs-label{font-size:11px;color:#9BA39D;text-transform:uppercase;letter-spacing:0.08em;font-family:'Inter',sans-serif;}
  .tabs{display:flex;gap:4px;background:rgba(255,255,255,0.06);padding:4px;border-radius:5px;}
  .tab-btn{
    background:transparent;
    border:1px solid transparent;
    color:#B9C3BC;
    padding:10px 22px;
    font-size:14px;
    text-transform:uppercase;
    letter-spacing:0.06em;
    cursor:pointer;
    border-radius:3px;
    transition:background 0.15s,color 0.15s;
  }
  .tab-btn:hover{color:#fff;}
  .tab-btn.active{
    background:var(--pitch);
    border-color:var(--pitch);
    color:#fff;
    box-shadow:0 1px 4px rgba(0,0,0,0.35);
  }

  main{max-width:980px;margin:0 auto;padding:24px 20px 60px;}
  section.view{display:none;}
  section.view.active{display:block;}

  /* ---------- Scoreboard hero ---------- */
  .scoreboard{
    background:var(--ink);
    color:#fff;
    padding:22px 24px;
    display:flex;
    flex-wrap:wrap;
    gap:28px;
    align-items:center;
    justify-content:space-between;
    margin-bottom:22px;
  }
  .scoreboard .record{display:flex;gap:22px;align-items:baseline;}
  .scoreboard .record div{text-align:center;}
  .scoreboard .big{font-size:34px;line-height:1;}
  .scoreboard .record .v .big{color:var(--pitch-light);}
  .scoreboard .record .n .big{color:#D9DDD9;}
  .scoreboard .record .d .big{color:#D98066;}
  .scoreboard .record small{display:block;font-size:11px;color:#9BA39D;text-transform:uppercase;letter-spacing:0.06em;margin-top:2px;}
  .scoreboard .goals{text-align:right;}
  .scoreboard .goals .big{font-size:26px;}
  .scoreboard .goals .big .for{color:var(--pitch-light);}
  .scoreboard .goals .big .sep{color:#6B746F;padding:0 6px;}
  .scoreboard .goals .big .against{color:#D98066;}
  .scoreboard .goals small{display:block;color:#9BA39D;font-size:11px;text-transform:uppercase;letter-spacing:0.06em;margin-top:4px;}

  /* ---------- Filters ---------- */
  .filters{
    display:flex;
    flex-wrap:wrap;
    gap:18px;
    align-items:center;
    padding:12px 0 18px;
    border-bottom:1px solid var(--line);
    margin-bottom:18px;
  }
  .filters label{
    font-size:13px;
    color:var(--ink-soft);
    display:flex;
    align-items:center;
    gap:8px;
  }
  .filters select, .filters input[type=text]{
    font-family:'Inter',sans-serif;
    font-size:14px;
    padding:6px 10px;
    border:1px solid var(--line-strong);
    background:#fff;
    color:var(--ink);
    border-radius:2px;
  }
  .filters .radio-group{display:flex;gap:14px;}
  .filters .radio-group label{gap:6px;cursor:pointer;}

  h2.section-title{
    font-size:19px;
    margin:34px 0 12px;
    padding-bottom:8px;
    border-bottom:2px solid var(--ink);
  }
  h2.section-title:first-child{margin-top:0;}

  /* ---------- Tables ---------- */
  table{
    width:100%;
    border-collapse:collapse;
    font-size:14px;
    background:var(--panel);
  }
  thead th{
    text-align:left;
    font-family:'Inter',sans-serif;
    font-weight:600;
    font-size:12.5px;
    text-transform:uppercase;
    letter-spacing:0.03em;
    color:var(--ink-soft);
    padding:8px 10px;
    border-bottom:2px solid var(--ink);
    white-space:nowrap;
  }
  thead th.sortable{cursor:pointer;user-select:none;}
  thead th.sortable:hover{color:var(--ink);}
  thead th.sort-active{color:var(--pitch);}
  tbody td{
    padding:9px 10px;
    border-bottom:1px solid var(--line);
    vertical-align:middle;
  }
  tbody tr:nth-child(even){background:#F7F8F5;}
  td.num, th.num{text-align:right;font-variant-numeric:tabular-nums;}
  .badge{
    display:inline-block;
    padding:2px 8px;
    font-size:12px;
    font-weight:600;
    border-radius:2px;
  }
  .badge.v{background:#E1EEE4;color:var(--pitch);}
  .badge.n{background:#EEEEEA;color:var(--ink-soft);}
  .badge.d{background:#F3E1DC;color:var(--brick);}

  .table-wrap{overflow-x:auto;margin-bottom:8px;}
  .table-wrap.compact table{font-size:12.5px;}
  th.col-match, td.col-match{background:rgba(30,86,49,0.07);}
  th.col-train, td.col-train{background:rgba(43,92,138,0.08);}
  th.col-match{border-bottom:2px solid var(--pitch-light) !important;}
  th.col-train{border-bottom:2px solid #2B5C8A !important;}
  .table-wrap.compact th, .table-wrap.compact td{padding:7px 6px;}
  body.u18-mode main{max-width:1180px;}
  .present-tick{color:var(--pitch-light);font-weight:700;}
  .absent-dash{color:var(--line-strong);}

  /* ---------- Charts ---------- */
  .chart-box{
    background:var(--panel);
    border:1px solid var(--line);
    padding:18px;
    margin-bottom:28px;
  }
  .chart-box canvas{max-height:320px;}

  /* ---------- Player card ---------- */
  .player-picker{margin-bottom:16px;}
  .player-card{
    background:var(--ink);
    color:#fff;
    padding:22px 24px;
    margin-bottom:28px;
  }
  .player-card h3{margin:0 0 4px;font-size:22px;color:#fff;}
  .player-card .team-tag{font-size:12.5px;color:#9BA39D;text-transform:uppercase;letter-spacing:0.05em;margin-bottom:16px;}
  .player-stats{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(110px,1fr));
    gap:16px;
  }
  .player-stats div{text-align:left;}
  .player-stats .num{font-size:26px;color:var(--pitch-light);}
  .player-stats small{display:block;font-size:11px;color:#9BA39D;text-transform:uppercase;letter-spacing:0.05em;margin-top:2px;}

  /* ---------- Détail de match ---------- */
  .match-picker{
    display:flex;flex-wrap:wrap;gap:12px;align-items:center;
    padding:12px 0 18px;border-bottom:1px solid var(--line);margin-bottom:18px;
  }
  .match-picker select{
    font-family:'Inter',sans-serif;font-size:14px;padding:6px 10px;
    border:1px solid var(--line-strong);background:#fff;border-radius:2px;min-width:220px;
  }
  tbody tr.match-row{cursor:pointer;}
  tbody tr.match-row:hover{background:#EAF1EB;}
  tbody tr.match-row td.detail-link{color:var(--pitch);font-weight:600;white-space:nowrap;}

  .match-detail-header{
    background:var(--ink);color:#fff;padding:20px 24px;margin-bottom:24px;
  }
  .match-detail-header h3{margin:0 0 4px;font-size:22px;color:#fff;}
  .match-detail-header .sub{color:#9BA39D;font-size:13px;}
  .match-detail-header .score{font-family:'Oswald',sans-serif;font-size:30px;margin-top:8px;}
  .match-detail-header .score .for{color:var(--pitch-light);}
  .match-detail-header .score .against{color:#D98066;}

  .lineup-grid{
    display:grid;grid-template-columns:1fr 1fr;gap:1px;
    background:var(--line);border:1px solid var(--line);margin-bottom:28px;
  }
  @media (max-width:640px){ .lineup-grid{grid-template-columns:1fr;} }
  .lineup-col{background:var(--panel);padding:16px 18px;}
  .lineup-col h4{
    margin:0 0 12px;font-size:13px;text-transform:uppercase;letter-spacing:0.05em;
    color:var(--ink-soft);font-family:'Inter',sans-serif;font-weight:600;
    border-bottom:1px solid var(--line);padding-bottom:8px;
  }
  .lineup-player{
    display:flex;justify-content:space-between;align-items:baseline;gap:8px;
    padding:7px 0;border-left:3px solid var(--pitch);padding-left:10px;margin-bottom:4px;
  }
  .lineup-col.bench .lineup-player{border-left-color:var(--line-strong);}
  .lineup-player .name{font-size:14.5px;}
  .lineup-player .tags{font-size:12px;color:var(--ink-soft);white-space:nowrap;}
  .lineup-player .badges{font-size:13px;margin-left:6px;}
  .lineup-empty{color:var(--ink-soft);font-size:13px;font-style:italic;}
  .absents{margin-top:14px;font-size:12.5px;color:var(--ink-soft);}

  /* ---------- Chronologie interactive du match ---------- */
  .timeline-card{
    background:var(--panel); border:1px solid var(--line); border-radius:5px;
    padding:16px 16px 4px; margin-bottom:28px; overflow-x:auto;
  }
  #match-timeline-svg{display:block;min-width:640px;}
  #match-timeline-svg text{font-family:'Inter',sans-serif;}
  .tl-player-name{font-size:11.5px;fill:var(--ink);}
  .tl-player-name.gk{font-weight:700;fill:var(--gk);}
  .tl-player-tag{font-size:9px;fill:var(--renfort);font-weight:600;}
  .tl-axis-label{font-size:10.5px;fill:var(--ink-soft);}
  .tl-score-label{font-family:'Oswald',sans-serif;font-weight:600;font-size:10.5px;}
  .tl-row-line{stroke:var(--line);stroke-width:1;}
  .tl-seg{cursor:pointer;transition:filter .12s;}
  .tl-seg:hover, .tl-seg.tl-active{filter:brightness(1.12) drop-shadow(0 1px 2px rgba(0,0,0,.25));}
  .tl-goal-hit, .tl-sub-hit{cursor:pointer;}
  .tl-goal-line{pointer-events:none;transition:stroke-width .12s;}
  .tl-legend{
    display:flex; gap:16px; flex-wrap:wrap; font-size:12px; color:var(--ink-soft);
    padding:10px 4px 14px;
  }
  .tl-legend span{display:inline-flex;align-items:center;gap:6px;}
  .tl-swatch{width:11px;height:11px;border-radius:2px;display:inline-block;}
  .tl-swatch.renfort{background:var(--pitch);border:1.5px dashed var(--renfort);box-sizing:border-box;}
  #tl-tooltip{
    position:fixed; z-index:50; pointer-events:none;
    background:var(--ink); color:#fff; font-size:12.5px; line-height:1.45;
    padding:9px 12px; border-radius:5px; max-width:240px;
    box-shadow:0 4px 14px rgba(0,0,0,.28);
    opacity:0; transform:translateY(4px); transition:opacity .1s, transform .1s;
  }
  #tl-tooltip.visible{opacity:1;transform:translateY(0);}
  #tl-tooltip .tt-title{font-family:'Oswald',sans-serif;font-weight:600;font-size:13px;margin-bottom:2px;display:block;}
  #tl-tooltip .tt-detail{color:#D3D8D3;}
  #tl-tooltip .pin-hint{display:block;margin-top:4px;font-size:10.5px;color:#9AA39C;}

  .empty, .error{
    padding:40px 20px;
    text-align:center;
    color:var(--ink-soft);
  }
  .error{color:var(--brick);}

  footer{
    max-width:980px;margin:0 auto;padding:10px 20px 40px;
    font-size:12px;color:var(--ink-soft);
  }

  @media (max-width:640px){
    .scoreboard{flex-direction:column;align-items:flex-start;}
    .scoreboard .goals{text-align:left;}
    h1{font-size:15px;}
    #match-table th:nth-child(3), #match-table td:nth-child(3),
    #match-table th:nth-child(7), #match-table td:nth-child(7){display:none;}
  }
</style>
</head>
<body>

<header class="masthead">
  <div class="masthead-inner">
    <div class="brand">
      <div class="crest">ACA</div>
      <div class="brand-text">
        <h1>Alliance Centre Alsace</h1>
        <p id="masthead-subtitle">U18 — Vue d'ensemble</p>
      </div>
    </div>
    <div class="selector-groups">
      <div class="team-tabs">
        <button class="team-tab-btn active" data-home="1">🏠 Accueil</button>
      </div>
      <div class="team-tabs">
        <button class="team-tab-btn" data-team="u18">U18</button>
        <button class="team-tab-btn" data-team="eq1">U18 Équipe 1</button>
        <button class="team-tab-btn" data-team="eq2">U18 Équipe 2</button>
      </div>
      <div class="team-tabs">
        <button class="team-tab-btn" data-group="u1415">U14-U15</button>
      </div>
      <div class="team-tabs">
        <button class="team-tab-btn" data-group="u1011">U10-U11</button>
      </div>
    </div>
  </div>
  <div class="masthead-row2" id="sub-tabs-row" style="display:none;">
    <div class="tabs-wrap">
      <span class="tabs-label">3 onglets :</span>
      <div class="tabs">
        <button class="tab-btn active" data-view="joueurs">👥 Joueurs</button>
        <button class="tab-btn" data-view="equipe">⚽ Matchs</button>
        <button class="tab-btn" data-view="entrainement">🏃 Entraînement</button>
      </div>
    </div>
  </div>
</header>

<main id="app">
  <div id="loading" class="empty">Chargement des statistiques…</div>
</main>

<footer id="footer" style="display:none;">
  Conception P. Meyer — dernière mise à jour de la page : <span id="footer-lastmod"></span>
</footer>

<div id="tl-tooltip"></div>

<script>
const DATA_FILES = { eq1: 'data_equipe1.xlsx', eq2: 'data_equipe2.xlsx' };
const ENTRAINEMENTS_FILE = 'entrainements.xlsx';
const TEAM_LABELS = { eq1: 'Équipe 1', eq2: 'Équipe 2' };
const TRAINING_TAGS = { eq1: /U18-1/i, eq2: /U18-2/i, u1011: /U10-U11/i, u1415: /U14-15|U14-U15/i };

const YOUTH_ROSTER_FILE = 'Effectif.xlsx';
const YOUTH_LABELS = { u1011: 'U10-U11', u1415: 'U14-U15' };
const YOUTH_MATCH_FILES = { u1011: 'data_U10-11.xlsx', u1415: 'data_U14-15.xlsx' };

function makeEmptyState(teamKey) {
  return {
    matches: [],
    players: [],
    convocations: [],
    buts: [],
    cartons: [],
    changements: [],
    gardien: [],
    currentView: 'joueurs',
    filters: { competition: 'Toutes', lieu: 'Tous' },
    playerFilters: { scope: 'own', search: '' },
    sort: { col: 'matchsJoues', dir: 'desc' },
    selectedPlayer: null,
    selectedMatch: null,
    teamKey: teamKey,
  };
}

let teamData = { eq1: null, eq2: null };
let teamError = { eq1: null, eq2: null };
let entrainementsData = { sessions: [], players: [] };
let topLevel = 'u18';
let state = makeEmptyState('eq2');

let youthRosters = { u1011: [], u1415: [] };
let youthMatchData = { u1011: null, u1415: null };
let youthMatchError = { u1011: null, u1415: null };
let youthSelectedMatch = { u1011: null, u1415: null };
let youthGroup = null; // null while in "seniors" mode

let topScorersChart = null;
let topAssistsChart = null;

// ---------------------------------------------------------------
// Chargement et lecture du classeur
// ---------------------------------------------------------------
async function loadTeam(teamKey) {
  const file = DATA_FILES[teamKey];
  const s = makeEmptyState(teamKey);
  const res = await fetch(file, { cache: 'no-store' });
  if (!res.ok) throw new Error('fichier introuvable (' + res.status + ')');
  const buf = await res.arrayBuffer();
  const wb = XLSX.read(buf, { type: 'array', cellDates: true });

  s.matches = parseMatches(wb);
  s.players = parsePlayers(wb);
  s.convocations = parseConvocations(wb);
  s.buts = parseButs(wb);
  s.cartons = parseCartons(wb);
  s.changements = parseChangements(wb);
  s.gardien = parseGardien(wb);
  return s;
}

async function loadEntrainements() {
  const res = await fetch(ENTRAINEMENTS_FILE, { cache: 'no-store' });
  if (!res.ok) throw new Error('fichier introuvable (' + res.status + ')');
  const buf = await res.arrayBuffer();
  const wb = XLSX.read(buf, { type: 'array', cellDates: true });
  return parseEntrainements(wb, TRAINING_TAGS);
}

async function loadYouthRosters() {
  const res = await fetch(YOUTH_ROSTER_FILE, { cache: 'no-store' });
  if (!res.ok) throw new Error('fichier introuvable (' + res.status + ')');
  const buf = await res.arrayBuffer();
  const wb = XLSX.read(buf, { type: 'array', cellDates: true });
  return parseYouthRosters(wb);
}

function parseYouthRosters(wb) {
  const ws = wb.Sheets[wb.SheetNames[0]];
  if (!ws) return { u1011: [], u1415: [] };
  const raw = XLSX.utils.sheet_to_json(ws, { header: 1, defval: null, raw: true });
  // Format : colonne B = U18 Équipe 1, C = U18 Équipe 2, D = U14-15, E = U10-11 ;
  // 2 lignes d'en-tête (catégorie / sous-catégorie), les données commencent ligne 3.
  // (SheetJS ignore la colonne A, vide sur toute la feuille : row[0]=B, row[1]=C, row[2]=D, row[3]=E.)
  const out = { u1011: [], u1415: [] };
  for (let r = 2; r < raw.length; r++) {
    const row = raw[r];
    if (!row) continue;
    if (typeof row[2] === 'string' && row[2].trim() && !row[2].toLowerCase().startsWith('total')) {
      out.u1415.push(row[2].trim());
    }
    if (typeof row[3] === 'string' && row[3].trim() && !row[3].toLowerCase().startsWith('total')) {
      out.u1011.push(row[3].trim());
    }
  }
  return out;
}

function isDateLike(v) {
  return Object.prototype.toString.call(v) === '[object Date]' && !isNaN(v);
}

function parseEntrainements(wb, tags) {
  const wsName = wb.SheetNames[0];
  const ws = wb.Sheets[wsName];
  if (!ws) return { sessions: [], players: [] };
  const raw = XLSX.utils.sheet_to_json(ws, { header: 1, defval: null, raw: true });
  if (raw.length < 3) return { sessions: [], players: [] };
  const headerRow = raw[0];
  const labelRow = raw[1];

  const sessions = [];
  for (let c = 6; c < headerRow.length; c++) {
    const dateVal = headerRow[c];
    const label = labelRow[c];
    if (isDateLike(dateVal) && label) {
      let team = null;
      for (const key in tags) {
        if (tags[key].test(label)) { team = key; break; }
      }
      sessions.push({ colIndex: c, date: dateVal, label: String(label), team });
    }
  }

  const players = [];
  for (let r = 2; r < raw.length; r++) {
    const row = raw[r];
    if (!row || typeof row[0] !== 'string') continue;
    const nom = row[0].trim();
    if (!nom || nom.startsWith('*')) continue;
    const legendWords = ['présent', 'en retard', 'absence valide', 'absent', 'non invité'];
    if (legendWords.includes(nom.toLowerCase())) continue;
    const presence = {};
    sessions.forEach(s => { presence[s.colIndex] = (row[s.colIndex] === 1 || row[s.colIndex] === 1.0); });
    players.push({ nom, presence });
  }
  return { sessions, players };
}

function normalizeName(s) {
  return (s || '').toString().toLowerCase()
    .normalize('NFD').replace(/[\u0300-\u036f]/g, '')
    .replace(/[^a-z]/g, '');
}

  const buf = await res.arrayBuffer();
  const wb = XLSX.read(buf, { type: 'array', cellDates: true });
  return {
    matches: parseYouthMatches(wb),
    convocations: parseYouthConvocations(wb),
    buts: parseYouthButs(wb),
    cartons: parseYouthCartons(wb),
    gardien: parseYouthGardien(wb),
  };
}

function sheetRows(wb, name) {
  const ws = wb.Sheets[name];
  if (!ws) return [];
  return XLSX.utils.sheet_to_json(ws, { header: 1, defval: null, raw: true });
}

function parseMatches(wb) {
  const raw = sheetRows(wb, 'Matchs');
  const out = [];
  for (let i = 3; i < raw.length; i++) {
    const r = raw[i];
    if (!r || r[1] == null) continue; // pas de date = match non encore joué
    out.push({
      numero: r[0], date: r[1], adversaire: r[2], competition: r[3] || '—',
      lieu: r[4] || '—', duree: r[5], scoreNous: r[6], scoreAdv: r[7],
      convoques: r[8], renforts: r[9], niveau: r[11] || 'Inconnu',
    });
  }
  out.sort((a, b) => new Date(a.date) - new Date(b.date));
  return out;
}

function escapeHtml(s) {
  return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
function fmtDate(d) {
  if (!isDateLike(d)) return '—';
  return d.toLocaleDateString('fr-FR', { day: '2-digit', month: '2-digit', year: 'numeric' });
}
function fmtDateShort(d) {
  if (!isDateLike(d)) return '—';
  return d.toLocaleDateString('fr-FR', { day: '2-digit', month: '2-digit' });
}
function resultat(m) {
  if (m.scoreNous == null || m.scoreAdv == null) return null;
  if (m.scoreNous > m.scoreAdv) return 'v';
  if (m.scoreNous < m.scoreAdv) return 'd';
  return 'n';
}
function resultatLabel(r) { return { v: 'Victoire', n: 'Nul', d: 'Défaite' }[r] || '—'; }

function computeCompositionStats() {
  const stats = new Map();

  function keyFor(set) { return Array.from(set).sort().join(' | '); }
  function ensure(key, players) {
    if (!stats.has(key)) stats.set(key, { players, minutes: 0, butsPour: 0, butsContre: 0, matches: new Set() });
    return stats.get(key);
  }

  state.matches.forEach(match => {
    const numero = match.numero;
    const conv = state.convocations.filter(c => c.numero === numero && c.convoque === 'Oui');
    if (conv.length === 0) return;
    const onField = new Set(conv.filter(c => c.titulaire === 'Oui').map(c => c.joueur));
    const duree = match.duree || 90;

    const timeline = [];
    state.changements.filter(c => c.numero === numero).forEach(c => timeline.push({ minute: c.minute || 0, kind: 'sub', sort: c.sort, entre: c.entre }));
    state.buts.filter(b => b.numero === numero).forEach(b => timeline.push({ minute: b.minute || 0, kind: 'goal', camp: b.camp }));
    timeline.sort((a, b) => a.minute - b.minute);

    let segmentStart = 0;
    let curKey = keyFor(onField);
    let curPlayers = Array.from(onField).sort();

    timeline.forEach(ev => {
      if (ev.kind === 'goal') {
        const entry = ensure(curKey, curPlayers);
        if (ev.camp === 'Nous') entry.butsPour++; else entry.butsContre++;
        entry.matches.add(numero);
      } else {
        const segMinutes = Math.max(0, ev.minute - segmentStart);
        if (segMinutes > 0) { const e = ensure(curKey, curPlayers); e.minutes += segMinutes; e.matches.add(numero); }
        if (ev.sort) onField.delete(ev.sort);
        if (ev.entre) onField.add(ev.entre);
        segmentStart = ev.minute;
        curKey = keyFor(onField);
        curPlayers = Array.from(onField).sort();
      }
    });
    const segMinutes = Math.max(0, duree - segmentStart);
    if (segMinutes > 0) { const e = ensure(curKey, curPlayers); e.minutes += segMinutes; e.matches.add(numero); }
  });

  return Array.from(stats.values())
    .filter(s => s.minutes > 0)
    .map(s => ({
      players: s.players,
      minutes: s.minutes,
      butsPour: s.butsPour,
      butsContre: s.butsContre,
      diff: s.butsPour - s.butsContre,
      matches: s.matches.size,
      diffPer90: (s.butsPour - s.butsContre) * 90 / s.minutes,
    }))
    .sort((a, b) => b.diffPer90 - a.diffPer90 || b.minutes - a.minutes);
}

function renderCompositionTable() {
  const table = document.getElementById('composition-table');
  const rows = computeCompositionStats();
  table.innerHTML = `
    <thead><tr>

      <th class="num">Buts marqués</th><th class="num">Buts encaissés</th>
      <th class="num">Diff.</th><th class="num">Diff. / 90 min</th>
    </tr></thead>
    <tbody>
      ${rows.length ? rows.map(r => `<tr>
        <td>${r.players.map(escapeHtml).join(', ')}</td>
        <td class="num">${r.minutes}</td>

        <td class="num">${r.butsContre}</td>

      </tr>`).join('') : '<tr><td colspan="6" class="empty">Pas assez de données pour calculer les compositions.</td></tr>'}
    </tbody>`;
}

// ---------------------------------------------------------------
// Détail par match : composition, frise chronologique, tableaux
// ---------------------------------------------------------------
function statsJoueurMatch(numero, nom) {
  const buts = state.buts.filter(b => b.numero === numero && b.buteur === nom).length;
  const passes = state.buts.filter(b => b.numero === numero && b.passeur === nom).length;
  const jaunes = state.cartons.filter(c => c.numero === numero && c.joueur === nom && c.type === 'Jaune').length;
  const rouges = state.cartons.filter(c => c.numero === numero && c.joueur === nom && c.type === 'Rouge').length;
  return { buts, passes, jaunes, rouges };
}

function badgesHtml(s) {
  let b = '';
  if (s.buts > 0) b += ' ⚽'.repeat(s.buts);
  if (s.passes > 0) b += ' 🅰️'.repeat(s.passes);
  if (s.jaunes > 0) b += ' 🟨'.repeat(s.jaunes);
  if (s.rouges > 0) b += ' 🟥'.repeat(s.rouges);
  return b;
}

function renderMatchDetail() {
  const box = document.getElementById('match-detail');
  const numero = state.selectedMatch;
  const match = state.matches.find(m => m.numero === numero);
  if (!match) { box.innerHTML = '<div class="empty">Sélectionnez un match.</div>'; return; }

  const conv = state.convocations.filter(c => c.numero === numero);
  const titulaires = conv.filter(c => c.convoque === 'Oui' && c.titulaire === 'Oui');
  const remplacants = conv.filter(c => c.convoque === 'Oui' && c.titulaire !== 'Oui');
  const absents = conv.filter(c => c.convoque !== 'Oui');
  const gardiensMatch = state.gardien.filter(g => g.numero === numero).map(g => g.gardien);

  const changementsM = state.changements.filter(c => c.numero === numero);
  const butsM = state.buts.filter(b => b.numero === numero);
  const cartonsM = state.cartons.filter(c => c.numero === numero);

  // --- Fusion changements + buts + cartons, triés par minute ---
  const events = [];
  changementsM.forEach(c => events.push({ minute: c.minute, kind: 'sub', sort: c.sort, entre: c.entre }));
  butsM.forEach(b => events.push({ minute: b.minute, kind: 'goal', buteur: b.buteur, passeur: b.passeur, camp: b.camp, type: b.type }));
  cartonsM.forEach(c => events.push({ minute: c.minute, kind: 'card', joueur: c.joueur, type: c.type, motif: c.motif }));
  events.sort((a, b) => (a.minute || 0) - (b.minute || 0));

  // --- Évolution du score au fil des événements ---
  let sNous = 0, sAdv = 0;
  const eventsWithScore = events.map(e => {
    if (e.kind === 'goal') { if (e.camp === 'Nous') sNous++; else sAdv++; }
    return Object.assign({}, e, { scoreNous: sNous, scoreAdv: sAdv });
  });

  const changementsTries = changementsM.slice().sort((a, b) => (a.minute || 0) - (b.minute || 0));

  const score = (match.scoreNous != null && match.scoreAdv != null)
    ? `<span class="for">${match.scoreNous}</span> – <span class="against">${match.scoreAdv}</span>` : '—';

  box.innerHTML = `
    <div class="match-detail-header">
      <h3>${escapeHtml(match.adversaire || 'Match ' + numero)}</h3>
      <div class="sub">${fmtDate(match.date)} · ${escapeHtml(match.competition)} · ${escapeHtml(match.lieu)}</div>
      <div class="score">${score}</div>
    </div>

    <h3 style="font-family:'Oswald',sans-serif;font-size:17px;margin:0 0 12px;">Composition</h3>
    <div class="lineup-grid">
      <div class="lineup-col">
        <h4>Onze de départ</h4>
        ${titulaires.length ? titulaires.map(p => lineupPlayerHtml(numero, p, gardiensMatch.includes(p.joueur))).join('') : '<div class="lineup-empty">Non renseigné</div>'}
      </div>
      <div class="lineup-col bench">
        <h4>Remplaçants</h4>
        ${remplacants.length ? remplacants.map(p => lineupPlayerHtml(numero, p, gardiensMatch.includes(p.joueur))).join('') : '<div class="lineup-empty">Aucun</div>'}
      </div>
    </div>
    ${absents.length ? `<div class="absents">Non convoqués : ${absents.map(a => escapeHtml(a.joueur) + (a.motif ? ` (${escapeHtml(a.motif)})` : '')).join(', ')}</div>` : ''}

    <h3 style="font-family:'Oswald',sans-serif;font-size:17px;margin:32px 0 16px;">Chronologie du match</h3>
    <div class="timeline-card">
      <div id="match-timeline-svg"></div>
      <div class="tl-legend">
        <span><span class="tl-swatch" style="background:var(--pitch);"></span>Sur le terrain (Équipe 2)</span>
        <span><span class="tl-swatch renfort"></span>Renfort Équipe 1</span>
        <span><span class="tl-swatch" style="background:var(--gk);"></span>Gardien</span>
        <span><span class="tl-swatch" style="background:var(--pitch-light);"></span>But marqué</span>
        <span><span class="tl-swatch" style="background:var(--brick);"></span>But encaissé</span>
        <span><span class="tl-swatch" style="background:var(--extra);border:1px solid var(--line-strong);"></span>Temps additionnel</span>
      </div>
    </div>

    <h3 style="font-family:'Oswald',sans-serif;font-size:17px;margin:32px 0 16px;">Vue tableau — Compositions</h3>
    <div class="table-wrap"><table>
      <thead><tr><th>Joueur</th><th>Équipe</th><th>Statut</th><th>Motif absence</th><th class="num">But</th><th class="num">Passe déc.</th><th>Carton</th><th class="num">Temps de jeu</th></tr></thead>
      <tbody>
        ${conv.map(p => {
          let statut = 'Non convoqué';
          if (p.convoque === 'Oui') statut = p.titulaire === 'Oui' ? 'Titulaire' : 'Remplaçant';
          const s = statsJoueurMatch(numero, p.joueur);
          let cartonTxt = '';
          if (s.jaunes) cartonTxt += '🟨'.repeat(s.jaunes);
          if (s.rouges) cartonTxt += '🟥'.repeat(s.rouges);
          return `<tr>
            <td>${escapeHtml(p.joueur)}</td>
            <td>${escapeHtml(p.equipe)}</td>

            <td class="num">${s.buts || '—'}</td>
            <td class="num">${s.passes || '—'}</td>
            <td>${cartonTxt || '—'}</td>
            <td class="num">${p.tempsJeu != null ? p.tempsJeu : '—'}</td>
          </tr>`;
        }).join('')}
      </tbody>
    </table></div>

    <h3 style="font-family:'Oswald',sans-serif;font-size:17px;margin:32px 0 16px;">Entrées / sorties</h3>
    <div class="table-wrap"><table>
      <thead><tr><th class="num">Minute</th><th>Sort</th><th>Entre</th></tr></thead>
      <tbody>
        ${changementsTries.length ? changementsTries.map(c => `<tr>
          <td class="num">${c.minute != null ? c.minute + '′' : '—'}</td>

    <div class="table-wrap"><table>
      <thead><tr><th class="num">Minute</th><th>Type</th><th>Détail</th><th class="num">Score</th></tr></thead>
      <tbody>
        ${eventsWithScore.length ? eventsWithScore.map(eventRowHtml).join('') : '<tr><td colspan="4" class="empty">Aucun événement.</td></tr>'}
      </tbody>
    </table></div>
  `;

  renderMatchTimeline(numero);
}

function lineupPlayerHtml(numero, p, isGardien) {
  const s = statsJoueurMatch(numero, p.joueur);
  const tags = [];
  if (isGardien) tags.push('🧤 Gardien');
  if (p.titulaire !== 'Oui' && p.minEntree != null) tags.push(`entré (${p.minEntree}e)`);
  else if (p.titulaire !== 'Oui' && p.minEntree == null) tags.push('non entré');
  return `<div class="lineup-player">
    <span class="name">${escapeHtml(p.joueur)}<span class="badges">${badgesHtml(s)}</span></span>
    <span class="tags">${tags.join(' · ')}</span>
  </div>`;
}

function eventRowHtml(e) {
  let type, detail;
  if (e.kind === 'sub') {
    type = 'Changement';
    detail = `${e.entre || '—'} entre, ${e.sort || '—'} sort`;
  } else if (e.kind === 'goal') {
    type = 'But';
    detail = e.camp === 'Nous'
      ? `${e.buteur || '—'}${e.passeur ? ' (passe déc. ' + e.passeur + ')' : ''} — ${e.type || ''}`
      : `But adverse — ${e.type || ''}`;
  } else {
    type = 'Carton';
    detail = `${e.joueur || '—'} — ${e.type || ''}${e.motif ? ' (' + e.motif + ')' : ''}`;
  }
  return `<tr><td class="num">${e.minute}′</td><td>${escapeHtml(type)}</td><td>${escapeHtml(detail)}</td><td class="num">${e.scoreNous} - ${e.scoreAdv}</td></tr>`;
}

// ---------------------------------------------------------------
// Chronologie interactive : joueurs sur le terrain + buts dans le temps
// ---------------------------------------------------------------
function buildOnFieldSegments(numero) {
  const conv = state.convocations.filter(c => c.numero === numero && c.convoque === 'Oui');
  const titulaires = conv.filter(c => c.titulaire === 'Oui').map(c => c.joueur);
  const changementsM = state.changements.filter(c => c.numero === numero).slice().sort((a, b) => (a.minute || 0) - (b.minute || 0));
  const butsM = state.buts.filter(b => b.numero === numero);
  const match = state.matches.find(m => m.numero === numero);
  const duree = (match && match.duree) || 90;
  const chartEnd = Math.max(duree, ...butsM.map(b => b.minute || 0), 0);

  const openStart = {};
  const segments = {};
  titulaires.forEach(j => { openStart[j] = 0; segments[j] = []; });
  changementsM.forEach(c => {
    if (openStart[c.sort] !== undefined) {
      segments[c.sort] = segments[c.sort] || [];
      segments[c.sort].push([openStart[c.sort], c.minute]);
      delete openStart[c.sort];
    }
    openStart[c.entre] = c.minute;
    segments[c.entre] = segments[c.entre] || [];
  });
  Object.keys(openStart).forEach(p => segments[p].push([openStart[p], chartEnd]));

  const order = titulaires.slice();
  changementsM.forEach(c => { if (!order.includes(c.entre)) order.push(c.entre); });

  const renforts = conv.filter(c => c.equipe && c.equipe !== 'Équipe 2').map(c => c.joueur);

  return { segments, order, duree, chartEnd, changementsM, butsM, renforts };
}

function renderMatchTimeline(numero) {
  const holder = document.getElementById('match-timeline-svg');
  if (!holder) return;
  const { segments, order, duree, chartEnd, changementsM, butsM, renforts } = buildOnFieldSegments(numero);
  const gardiensMatch = state.gardien.filter(g => g.numero === numero).map(g => g.gardien);

  if (order.length === 0) {
    holder.innerHTML = '<div class="empty">Composition non renseignée pour ce match.</div>';
    return;
  }

  const marginLeft = 132, marginRight = 46, marginTop = 76, rowH = 25;
  const chartW = 700;
  const rowsH = order.length * rowH;
  const totalH = marginTop + rowsH + 26;
  const totalW = marginLeft + chartW + marginRight;
  const x = m => marginLeft + (m / (chartEnd || 1)) * chartW;

  let sN = 0, sA = 0;
  const goalsWithScore = butsM.slice().sort((a, b) => (a.minute || 0) - (b.minute || 0)).map(g => {
    if (g.camp === 'Nous') sN++; else sA++;
    return Object.assign({}, g, { scoreNous: sN, scoreAdv: sA });
  });

  const scoreTop = 20, scoreH = 44;
  const maxScore = Math.max(1, ...goalsWithScore.map(g => Math.max(g.scoreNous, g.scoreAdv)));
  const yScore = v => scoreTop + scoreH - (v / maxScore) * scoreH;

  function stepPath(key, color) {
    let d = `M ${x(0)} ${yScore(0)}`, last = 0;
    goalsWithScore.forEach(g => {
      d += ` L ${x(g.minute)} ${yScore(last)}`;
      last = g[key];
      d += ` L ${x(g.minute)} ${yScore(last)}`;
    });
    d += ` L ${x(chartEnd)} ${yScore(last)}`;
    return `<path d="${d}" fill="none" stroke="${color}" stroke-width="2.25"/>`;
  }

  let svg = `<svg viewBox="0 0 ${totalW} ${totalH}" style="display:block;width:100%;">`;

  if (chartEnd > duree) {
    svg += `<rect x="${x(duree)}" y="${scoreTop}" width="${x(chartEnd)-x(duree)}" height="${rowsH + (marginTop-scoreTop)}" fill="var(--extra)"/>`;
  }

  svg += stepPath('scoreNous', 'var(--pitch-light)');
  svg += stepPath('scoreAdv', 'var(--brick)');
  svg += `<text x="${marginLeft - 10}" y="${yScore(0)+4}" text-anchor="end" class="tl-axis-label">Score</text>`;

  changementsM.forEach(c => {
    svg += `<line class="tl-sub-hit" data-type="sub" data-minute="${c.minute}" data-sort="${escapeHtml(c.sort)}" data-entre="${escapeHtml(c.entre)}"
              x1="${x(c.minute)}" y1="${marginTop}" x2="${x(c.minute)}" y2="${marginTop + rowsH}" stroke="transparent" stroke-width="8"/>`;
    svg += `<line x1="${x(c.minute)}" y1="${marginTop}" x2="${x(c.minute)}" y2="${marginTop + rowsH}"
              stroke="var(--line-strong)" stroke-width="1" stroke-dasharray="1,3" pointer-events="none"/>`;
  });

  goalsWithScore.forEach(g => {
    const color = g.camp === 'Nous' ? 'var(--pitch-light)' : 'var(--brick)';
    svg += `<line class="tl-goal-hit" data-type="goal" data-minute="${g.minute}" data-camp="${g.camp}"
              data-buteur="${escapeHtml(g.buteur)}" data-passeur="${escapeHtml(g.passeur)}" data-score="${g.scoreNous}-${g.scoreAdv}"
              x1="${x(g.minute)}" y1="${scoreTop}" x2="${x(g.minute)}" y2="${marginTop + rowsH}" stroke="transparent" stroke-width="10"/>`;
    svg += `<line class="tl-goal-line" x1="${x(g.minute)}" y1="${scoreTop}" x2="${x(g.minute)}" y2="${marginTop + rowsH}"
              stroke="${color}" stroke-width="1.4" stroke-dasharray="3,3" opacity="0.8"/>`;
    svg += `<text x="${x(g.minute)}" y="${scoreTop - 1}" text-anchor="middle" class="tl-score-label" fill="${color}" pointer-events="none">${g.scoreNous}-${g.scoreAdv}</text>`;
  });

  svg += `<line x1="${x(45)}" y1="${marginTop}" x2="${x(45)}" y2="${marginTop+rowsH}" stroke="var(--line-strong)" stroke-width="1" pointer-events="none"/>`;
  for (let m = 0; m <= duree; m += 15) {
    svg += `<text x="${x(m)}" y="${marginTop+rowsH+17}" text-anchor="middle" class="tl-axis-label">${m}'</text>`;
  }
  if (chartEnd > duree) {
    svg += `<text x="${x(chartEnd)}" y="${marginTop+rowsH+17}" text-anchor="middle" class="tl-axis-label">+${Math.round(chartEnd-duree)}'</text>`;
  }

  order.forEach((j, i) => {
    const y = marginTop + i * rowH;
    const isGK = gardiensMatch.includes(j);
    const isRenfort = renforts.includes(j);
    const totalMin = (segments[j] || []).reduce((sum, [s, e]) => sum + (Math.min(e, duree) - s), 0);
    svg += `<text x="${marginLeft - 12}" y="${y + rowH/2 + 4}" text-anchor="end" class="tl-player-name${isGK?' gk':''}">${isGK?'🧤 ':''}${escapeHtml(j)}${isRenfort ? ' <tspan class="tl-player-tag">Éq.1</tspan>' : ''}</text>`;
    (segments[j] || []).forEach(([s, e]) => {
      const fill = isGK ? 'var(--gk)' : 'var(--pitch)';
      const dash = isRenfort ? `stroke="var(--renfort)" stroke-width="1.4" stroke-dasharray="3,2"` : '';
      svg += `<rect class="tl-seg" data-type="player" data-player="${escapeHtml(j)}" data-start="${s}" data-end="${Math.min(e, duree)}"
                data-duree="${Math.min(e, chartEnd) - s}" data-gk="${isGK}" data-renfort="${isRenfort}"
                x="${x(s)}" y="${y + 4}" width="${Math.max(2, x(e)-x(s))}" height="${rowH-8}"
                rx="3" fill="${fill}" opacity="0.9" ${dash}/>`;
    });
    svg += `<text x="${marginLeft + chartW + 8}" y="${y + rowH/2 + 4}" class="tl-axis-label">${totalMin} min</text>`;
    svg += `<line class="tl-row-line" x1="${marginLeft}" y1="${y+rowH}" x2="${marginLeft+chartW}" y2="${y+rowH}"/>`;
  });

  svg += `</svg>`;
  holder.innerHTML = svg;
  attachTimelineInteractions(holder, duree);
}

let tlPinned = null;
function attachTimelineInteractions(holder, duree) {
  const tooltip = document.getElementById('tl-tooltip');

  function contentFor(el) {
    const t = el.dataset.type;
    if (t === 'player') {
      const range = (el.dataset.start === '0' && Number(el.dataset.end) >= duree) ? 'Tout le match' : `${el.dataset.start}′ → ${el.dataset.end}′`;
      const role = el.dataset.gk === 'true' ? 'Gardien' : (el.dataset.renfort === 'true' ? 'Renfort Équipe 1' : 'Équipe 2');
      return `<span class="tt-title">${escapeHtml(el.dataset.player)}</span><span class="tt-detail">${role} · ${range} (${el.dataset.duree} min)</span>`;
    }
    if (t === 'goal') {
      const label = el.dataset.camp === 'Nous' ? 'But marqué' : 'But encaissé';
      const scorer = el.dataset.camp === 'Nous'
        ? `${escapeHtml(el.dataset.buteur) || '—'}${el.dataset.passeur && el.dataset.passeur !== 'null' && el.dataset.passeur !== '' ? ' (passe déc. ' + escapeHtml(el.dataset.passeur) + ')' : ''}`
        : 'Adversaire';
      return `<span class="tt-title">${el.dataset.minute}′ — ${label}</span><span class="tt-detail">${scorer}<br>Score : ${el.dataset.score}</span>`;
    }
    if (t === 'sub') {
      return `<span class="tt-title">Changement — ${el.dataset.minute}′</span><span class="tt-detail">${escapeHtml(el.dataset.entre)} entre<br>${escapeHtml(el.dataset.sort)} sort</span>`;
    }
    return '';
  }
  function showTooltip(el, evt) {
    tooltip.innerHTML = contentFor(el) + `<span class="pin-hint">${tlPinned === el ? 'Cliquez pour désépingler' : 'Cliquez pour épingler'}</span>`;
    tooltip.classList.add('visible');
    positionTooltip(evt);
  }
  function positionTooltip(evt) {
    const pad = 14;
    let left = evt.clientX + pad, top = evt.clientY + pad;
    if (left + 250 > window.innerWidth) left = evt.clientX - 250 - pad;
    if (top + 90 > window.innerHeight) top = evt.clientY - 90 - pad;
    tooltip.style.left = left + 'px';
    tooltip.style.top = top + 'px';
  }
  function hideTooltip() { if (!tlPinned) tooltip.classList.remove('visible'); }

  holder.querySelectorAll('.tl-seg, .tl-goal-hit, .tl-sub-hit').forEach(el => {
    el.addEventListener('mouseenter', evt => { if (!tlPinned) showTooltip(el, evt); });
    el.addEventListener('mousemove', evt => { if (!tlPinned) positionTooltip(evt); });
    el.addEventListener('mouseleave', hideTooltip);
    el.addEventListener('click', evt => {
      evt.stopPropagation();
      holder.querySelectorAll('.tl-active').forEach(a => a.classList.remove('tl-active'));
      if (tlPinned === el) {
        tlPinned = null;
        tooltip.classList.remove('visible');
      } else {
        tlPinned = el;
        el.classList.add('tl-active');
        showTooltip(el, evt);
      }
    });
  });
}

document.addEventListener('click', () => {
  if (tlPinned) {
    tlPinned.classList.remove('tl-active');
    tlPinned = null;
    const tooltip = document.getElementById('tl-tooltip');
    if (tooltip) tooltip.classList.remove('visible');
  }
});

function filteredPlayers() {
  const ownLabel = TEAM_LABELS[state.teamKey];
  return state.players.filter(p => {
    if (state.playerFilters.scope === 'own' && p.matchsJoues === 0 && p.equipe !== ownLabel) return false;
    if (state.playerFilters.scope === 'ownonly' && p.equipe !== ownLabel) return false;
    if (state.playerFilters.search) {
      const s = state.playerFilters.search.toLowerCase();
      if (!p.nom.toLowerCase().includes(s)) return false;
    }
    return true;
  });
}

let u18Filters = { search: '' };
let u18Sort = { col: 'matchsJoues', dir: 'desc' };

function mergedU18Players() {
  const map = new Map();
  ['eq1', 'eq2'].forEach(key => {
    const td = teamData[key];
    if (!td) return;
    td.players.forEach(p => {
      let cur = map.get(p.nom);
      if (!cur) {
        cur = { nom: p.nom, equipe: p.equipe, matchsJoues: 0, buts: 0, tete: 0, penalty: 0, coupFranc: 0, passes: 0, jaunes: 0, rouges: 0, tempsJeu: 0, convocations: 0, convocationsEq1: 0, convocationsEq2: 0 };
        map.set(p.nom, cur);
      }
      cur.matchsJoues += p.matchsJoues || 0;
      cur.buts += p.buts || 0;
      cur.tete += p.tete || 0;
      cur.penalty += p.penalty || 0;
      cur.coupFranc += p.coupFranc || 0;
      cur.passes += p.passes || 0;
      cur.jaunes += p.jaunes || 0;
      cur.rouges += p.rouges || 0;
      cur.tempsJeu += p.tempsJeu || 0;
      cur.convocations += p.convocations || 0;
      if (key === 'eq1') cur.convocationsEq1 += p.convocations || 0;
      else cur.convocationsEq2 += p.convocations || 0;
    });
  });
  const eq1MatchCount = teamData.eq1 ? teamData.eq1.matches.length : 0;
  const eq2MatchCount = teamData.eq2 ? teamData.eq2.matches.length : 0;
  const totalMatches = eq1MatchCount + eq2MatchCount;
  return Array.from(map.values()).map(p => ({
    ...p,
    tauxConv: totalMatches > 0 ? p.convocations / totalMatches : null,
    tauxConvEq1: eq1MatchCount > 0 ? p.convocationsEq1 / eq1MatchCount : null,
    tauxConvEq2: eq2MatchCount > 0 ? p.convocationsEq2 / eq2MatchCount : null,
  }));
}

function renderU18() {
  const el = document.getElementById('app');
  const players = mergedU18Players();

  if (players.length === 0) {

function renderU18PlayerTable() {
  let players = mergedU18Players().map(p => {
    const teamKeyForPlayer = p.equipe === 'Équipe 1' ? 'eq1' : (p.equipe === 'Équipe 2' ? 'eq2' : null);
    const train = teamKeyForPlayer ? trainingStatsForTeam(p.nom, teamKeyForPlayer) : { count: 0, rate: null };
    return Object.assign({}, p, { trainCount: train.count, trainRate: train.rate });
  });
  if (u18Filters.search) {
    const s = u18Filters.search.toLowerCase();
    players = players.filter(p => p.nom.toLowerCase().includes(s));
  }
  const { col, dir } = u18Sort;
  players.sort((a, b) => {
    let va = a[col], vb = b[col];
    if (typeof va === 'string') { va = va.toLowerCase(); vb = (vb || '').toLowerCase(); }
    else { va = va || 0; vb = vb || 0; }
    if (va < vb) return dir === 'asc' ? -1 : 1;
    if (va > vb) return dir === 'asc' ? 1 : -1;
    if (col !== 'matchsJoues' && (a.matchsJoues || 0) !== (b.matchsJoues || 0)) {
      return (b.matchsJoues || 0) - (a.matchsJoues || 0);
    }
    if (col !== 'tempsJeu') return (b.tempsJeu || 0) - (a.tempsJeu || 0);
    return 0;
  });

  const table = document.getElementById('u18-player-table');
  table.innerHTML = `
    <thead><tr>
      ${U18_SORTABLE_COLS.map(c => `<th class="sortable ${c.num?'num':''} ${c.group?'col-'+c.group:''} ${u18Sort.col===c.key?'sort-active':''}" data-col="${c.key}">
        ${c.label}${u18Sort.col===c.key ? (u18Sort.dir==='asc'?' ▲':' ▼') : ''}
      </th>`).join('')}
    </tr></thead>
    <tbody>
      ${players.map(p => `<tr>
        <td>${escapeHtml(p.nom)} <small style="color:var(--ink-soft)">(${escapeHtml(p.equipe)})</small></td>
        <td class="num">${p.matchsJoues}</td>
        <td class="num">${p.tempsJeu}</td>
        <td class="num">${p.buts}</td>
        <td class="num">${p.tete}</td>
        <td class="num">${p.penalty}</td>
        <td class="num">${p.coupFranc}</td>
        <td class="num">${p.passes}</td>
        <td class="num">${p.jaunes}</td>
        <td class="num">${p.rouges}</td>
        <td class="num col-match">${p.tauxConv != null ? Math.round(p.tauxConv*100)+'%' : '—'}</td>
        <td class="num col-match">${p.tauxConvEq1 != null ? Math.round(p.tauxConvEq1*100)+'%' : '—'}</td>
        <td class="num col-match">${p.tauxConvEq2 != null ? Math.round(p.tauxConvEq2*100)+'%' : '—'}</td>
        <td class="num col-train">${p.trainCount}</td>
        <td class="num col-train">${p.trainRate != null ? Math.round(p.trainRate*100)+'%' : '—'}</td>
      </tr>`).join('') || '<tr><td colspan="15" class="empty">Aucun joueur ne correspond à ce filtre.</td></tr>'}
    </tbody>`;

  table.querySelectorAll('th.sortable').forEach(th => {
    th.addEventListener('click', () => {
      const col = th.dataset.col;
      if (u18Sort.col === col) u18Sort.dir = u18Sort.dir === 'asc' ? 'desc' : 'asc';
      else { u18Sort.col = col; u18Sort.dir = 'desc'; }
      renderU18PlayerTable();
    });
  });
}

function renderAbsencesTimeline() {
  const el = document.getElementById('absences-timeline');
  const matchByNum = {};
  state.matches.forEach(m => matchByNum[m.numero] = m);

  const entries = state.convocations
    .filter(c => c.convoque !== 'Oui' && c.motif && matchByNum[c.numero])
    .map(c => ({ joueur: c.joueur, motif: c.motif, match: matchByNum[c.numero] }));

  if (entries.length === 0) {
    el.innerHTML = '<div class="empty">Aucune absence enregistrée pour l\'instant.</div>';
    return;
  }

  const motifs = ['Non retenu', 'Blessé/malade', "Pas venu à l'entraînement", 'Autre'];
  const byPlayer = {};
  entries.forEach(e => {
    if (!byPlayer[e.joueur]) {
      byPlayer[e.joueur] = { joueur: e.joueur, total: 0, lastDate: null, counts: {} };
      motifs.forEach(m => byPlayer[e.joueur].counts[m] = 0);
    }
    const p = byPlayer[e.joueur];
    if (p.counts[e.motif] == null) p.counts[e.motif] = 0;
    p.counts[e.motif]++;
    p.total++;
    if (!p.lastDate || new Date(e.match.date) > new Date(p.lastDate)) p.lastDate = e.match.date;
  });

  const extraMotifs = [...new Set(entries.map(e => e.motif))].filter(m => !motifs.includes(m));
  const allMotifs = motifs.concat(extraMotifs);

  const rows = Object.values(byPlayer).sort((a, b) => b.total - a.total || a.joueur.localeCompare(b.joueur));

  el.innerHTML = `
    <div class="table-wrap compact"><table>
      <thead><tr>
        <th>Joueur</th>
        ${allMotifs.map(m => `<th class="num">${escapeHtml(m)}</th>`).join('')}
        <th class="num">Total</th>
        <th>Dernière absence</th>
      </tr></thead>
      <tbody>
        ${rows.map(p => `<tr>
          <td>${escapeHtml(p.joueur)}</td>
          ${allMotifs.map(m => `<td class="num">${p.counts[m] ? p.counts[m] : '—'}</td>`).join('')}
          <td class="num"><strong>${p.total}</strong></td>
          <td>${fmtDate(p.lastDate)}</td>
        </tr>`).join('')}
      </tbody>
    </table></div>
  `;
}

function sameDay(d1, d2) {
  return d1.getFullYear() === d2.getFullYear() && d1.getMonth() === d2.getMonth() && d1.getDate() === d2.getDate();
}

function renderEntrainement() {
  const el = document.getElementById('view-entrainement');
  const allSessions = entrainementsData.sessions.filter(s => s.team === state.teamKey).sort((a, b) => a.date - b.date);

  if (allSessions.length === 0) {
    el.innerHTML = '<div class="empty">Aucune séance d\'entraînement enregistrée pour ' + TEAM_LABELS[state.teamKey] + ' pour l\'instant.</div>';
    return;
  }

  const ownRosterNorm = state.players
    .filter(p => p.equipe === TEAM_LABELS[state.teamKey])
    .map(p => normalizeName(p.nom));
  const otherTeamKey = state.teamKey === 'eq1' ? 'eq2' : 'eq1';
  const otherRosterNorm = state.players
    .filter(p => p.equipe === TEAM_LABELS[otherTeamKey])
    .map(p => normalizeName(p.nom));

  function matchesAny(fileName, list) {
    const n = normalizeName(fileName);
    return list.some(r => n.includes(r) || r.includes(n));
  }
  function isOwnPlayer(fileName) { return matchesAny(fileName, ownRosterNorm); }
  function isOtherTeamPlayer(fileName) { return matchesAny(fileName, otherRosterNorm); }

  // Présence à une date donnée : on regarde toutes les séances de ce jour-là (les deux
  // équipes s'entraînent parfois au même endroit/horaire et une présence peut se retrouver
  // enregistrée sous l'autre étiquette), pas seulement la colonne taguée pour cette équipe.
  function presentOnDate(player, date) {
    return entrainementsData.sessions.some(s2 => sameDay(s2.date, date) && player.presence[s2.colIndex]);
  }

  const rows = entrainementsData.players
    .filter(p => !isOtherTeamPlayer(p.nom))
    .map(p => {
      const own = isOwnPlayer(p.nom);
      // Pour les joueurs de cette équipe : on cherche la présence sur toute la journée
      // (corrige les cas où sa présence a été enregistrée sous l'étiquette de l'autre équipe).
      // Pour un joueur inconnu (ni l'une ni l'autre équipe, ex. nouvel essai) : on s'en tient
      // strictement à la colonne de cette équipe.
      const presence = allSessions.map(s => own ? presentOnDate(p, s.date) : !!p.presence[s.colIndex]);
      const count = presence.filter(Boolean).length;
      return { nom: p.nom, count, rate: count / allSessions.length, presence, own };
    })
    .filter(p => p.own || p.count > 0)
    .sort((a, b) => b.rate - a.rate || a.nom.localeCompare(b.nom));

  el.innerHTML = `
    <h2 class="section-title">Présences aux entraînements</h2>
    <p style="font-size:13px;color:var(--ink-soft);margin:-6px 0 14px;">
      ${allSessions.length} séance${allSessions.length > 1 ? 's' : ''} enregistrée${allSessions.length > 1 ? 's' : ''}
      du ${fmtDate(allSessions[0].date)} au ${fmtDate(allSessions[allSessions.length - 1].date)}.
    </p>
    <div class="table-wrap compact"><table>
      <thead><tr>
        <th>Joueur</th>
        ${allSessions.map(s => `<th class="num" title="${escapeHtml(s.label)}">${fmtDateShort(s.date)}</th>`).join('')}
        <th class="num">Séances</th>
        <th class="num">% présence</th>
      </tr></thead>
      <tbody>
        ${rows.map(p => `<tr>
          <td>${escapeHtml(p.nom)}</td>
          ${p.presence.map(present => `<td class="num">${present ? '<span class="present-tick">✓</span>' : '<span class="absent-dash">—</span>'}</td>`).join('')}
          <td class="num">${p.count}/${allSessions.length}</td>
          <td class="num"><strong>${Math.round(p.rate * 100)}%</strong></td>
        </tr>`).join('') || `<tr><td colspan="${allSessions.length + 3}" class="empty">Aucun joueur.</td></tr>`}
      </tbody>
    </table></div>
  `;
}

function youthTrainingStatsFor(name, sessions) {
  if (sessions.length === 0) return { count: 0, rate: null };
  const normTarget = normalizeName(name);
  const entry = entrainementsData.players.find(p => {
    const n = normalizeName(p.nom);
    return n.includes(normTarget) || normTarget.includes(n);
  });
  if (!entry) return { count: 0, rate: 0 };
  const count = sessions.filter(s => entry.presence[s.colIndex]).length;
  return { count, rate: count / sessions.length };
}

function trainingStatsForTeam(name, teamKey) {
  const sessions = entrainementsData.sessions.filter(s => s.team === teamKey);
  if (sessions.length === 0) return { count: 0, rate: null };
  const normTarget = normalizeName(name);
  const entry = entrainementsData.players.find(p => {
    const n = normalizeName(p.nom);
    return n.includes(normTarget) || normTarget.includes(n);
  });
  if (!entry) return { count: 0, rate: 0 };
  // Comme dans l'onglet Entraînement : on regarde toutes les séances du même jour, pas
  // seulement la colonne taguée pour cette équipe (une présence peut s'y retrouver sous
  // l'étiquette de l'autre équipe).
  const count = sessions.filter(s =>
    entrainementsData.sessions.some(s2 => sameDay(s2.date, s.date) && entry.presence[s2.colIndex])
  ).length;
  return { count, rate: count / sessions.length };
}

function computeYouthMatchStats(key, roster) {
  const data = youthMatchData[key];
  const matchByNum = {};
  const internalTeams = [];
  const seenTeams = new Set();
  let totalDates = 0;

  if (data) {
    data.matches.forEach(m => { matchByNum[m.numero] = m; });
    data.matches.forEach(m => {
      const team = m.equipe || '—';
      if (!seenTeams.has(team)) { seenTeams.add(team); internalTeams.push(team); }
    });
    internalTeams.sort();
    const uniqueDates = new Set(data.matches.filter(m => isDateLike(m.date)).map(m => m.date.getTime()));
    totalDates = uniqueDates.size;
  }

  const rows = roster.map(name => {
    if (!data) {
      return { nom: name, matchsJoues: 0, buts: 0, tete: 0, penalty: 0, coupFranc: 0, passes: 0, jaunes: 0, rouges: 0, tauxConv: null, tauxConvByTeam: {} };
    }
    const convs = data.convocations.filter(c => c.joueur === name);
    const convOui = convs.filter(c => c.convoque === 'Oui');
    const matchsJoues = convOui.length;
    const buts = data.buts.filter(b => b.buteur === name).length;
    const tete = data.buts.filter(b => b.buteur === name && b.type === 'Tête').length;
    const penalty = data.buts.filter(b => b.buteur === name && b.type === 'Penalty').length;
    const coupFranc = data.buts.filter(b => b.buteur === name && b.type === 'CF').length;
    const passes = data.buts.filter(b => b.passeur === name).length;
    const jaunes = data.cartons.filter(c => c.joueur === name && c.type === 'Jaune').length;
    const rouges = data.cartons.filter(c => c.joueur === name && c.type === 'Rouge').length;
    // % conv. : proportion des dates de match où le joueur a été convoqué (une seule équipe possible par date).
    const tauxConv = totalDates > 0 ? matchsJoues / totalDates : null;
    // % par équipe : répartition de SES convocations entre les équipes internes (et non un taux
    // par rapport au nombre de matchs de chaque équipe).
    const tauxConvByTeam = {};
    internalTeams.forEach(team => {
      const teamConvOui = convOui.filter(c => matchByNum[c.numero] && (matchByNum[c.numero].equipe || '—') === team).length;
      tauxConvByTeam[team] = matchsJoues > 0 ? teamConvOui / matchsJoues : null;
    });
    return { nom: name, matchsJoues, buts, tete, penalty, coupFranc, passes, jaunes, rouges, tauxConv, tauxConvByTeam };
  });

  return { rows, internalTeams };
}

function renderYouthJoueurs(key) {
  const el = document.getElementById('view-joueurs');
  const roster = youthRosters[key] || [];
  if (roster.length === 0) {
    el.innerHTML = '<div class="empty">Effectif non disponible pour ce groupe. Vérifiez que le fichier <code>' + YOUTH_ROSTER_FILE + '</code> est bien présent.</div>';
    return;
  }
  const sessions = entrainementsData.sessions.filter(s => s.team === key).sort((a, b) => a.date - b.date);
  const { rows: matchStats, internalTeams } = computeYouthMatchStats(key, roster);
  const statsByName = {};
  matchStats.forEach(r => { statsByName[r.nom] = r; });

  const rows = roster
    .map(name => Object.assign({ nom: name }, statsByName[name], trainingStatsForTeam(name, key)))
    .sort((a, b) => (b.matchsJoues || 0) - (a.matchsJoues || 0) || (b.rate || 0) - (a.rate || 0) || a.nom.localeCompare(b.nom));

  el.innerHTML = `
    <h2 class="section-title">Effectif — ${escapeHtml(YOUTH_LABELS[key])}</h2>
    <p style="font-size:13px;color:var(--ink-soft);margin:-6px 0 14px;">${roster.length} joueurs.</p>
    <div class="table-wrap compact"><table>
      <thead><tr>
        <th>Joueur</th>
        <th class="num">MJ</th>
        <th class="num">Buts</th>
        <th class="num">Tête</th>
        <th class="num">Pen.</th>
        <th class="num">CF</th>
        <th class="num">Passes</th>
        <th class="num">CJ</th>
        <th class="num">CR</th>
        <th class="num col-match">⚽ % conv.</th>
        ${internalTeams.map(t => `<th class="num col-match">⚽ % ${escapeHtml(t)}</th>`).join('')}
        <th class="num col-train">🏃 Séances</th>
        <th class="num col-train">🏃 % présence</th>
      </tr></thead>
      <tbody>
        ${rows.map(r => `<tr>
          <td>${escapeHtml(r.nom)}</td>
          <td class="num">${r.matchsJoues || 0}</td>
          <td class="num">${r.buts || 0}</td>
          <td class="num">${r.tete || 0}</td>
          <td class="num">${r.penalty || 0}</td>
          <td class="num">${r.coupFranc || 0}</td>
          <td class="num">${r.passes || 0}</td>
          <td class="num">${r.jaunes || 0}</td>
          <td class="num">${r.rouges || 0}</td>
          <td class="num col-match">${r.tauxConv != null ? Math.round(r.tauxConv * 100) + '%' : '—'}</td>
          ${internalTeams.map(t => `<td class="num col-match">${r.tauxConvByTeam && r.tauxConvByTeam[t] != null ? Math.round(r.tauxConvByTeam[t] * 100) + '%' : '—'}</td>`).join('')}
          <td class="num col-train">${r.count || 0}/${sessions.length}</td>
          <td class="num col-train">${r.rate != null ? Math.round(r.rate * 100) + '%' : '—'}</td>
        </tr>`).join('')}
      </tbody>
    </table></div>
  `;
}

function renderYouthEntrainementView(key) {
  const el = document.getElementById('view-entrainement');
  const sessions = entrainementsData.sessions.filter(s => s.team === key).sort((a, b) => a.date - b.date);

  if (sessions.length === 0) {
    el.innerHTML = '<div class="empty">Aucune séance d\'entraînement enregistrée pour ' + escapeHtml(YOUTH_LABELS[key]) + ' pour l\'instant.</div>';
    return;
  }

  const roster = youthRosters[key] || [];
  const rosterNorm = roster.map(normalizeName);
  function isOwn(name) {
    const n = normalizeName(name);
    return rosterNorm.some(r => n.includes(r) || r.includes(n));
  }

  const rows = entrainementsData.players
    .filter(p => isOwn(p.nom))
    .map(p => {
      const presence = sessions.map(s => !!p.presence[s.colIndex]);
      const count = presence.filter(Boolean).length;
      return { nom: p.nom, count, rate: count / sessions.length, presence };
    })
    .sort((a, b) => b.rate - a.rate || a.nom.localeCompare(b.nom));

  el.innerHTML = `
    <h2 class="section-title">Présences aux entraînements</h2>
    <p style="font-size:13px;color:var(--ink-soft);margin:-6px 0 14px;">
      ${sessions.length} séance${sessions.length > 1 ? 's' : ''} enregistrée${sessions.length > 1 ? 's' : ''}
      du ${fmtDate(sessions[0].date)} au ${fmtDate(sessions[sessions.length - 1].date)}.
    </p>
    <div class="table-wrap compact"><table>
      <thead><tr>
        <th>Joueur</th>
        ${sessions.map(s => `<th class="num" title="${escapeHtml(s.label)}">${fmtDateShort(s.date)}</th>`).join('')}
        <th class="num">Séances</th>
        <th class="num">% présence</th>
      </tr></thead>
      <tbody>
        ${rows.map(p => `<tr>
          <td>${escapeHtml(p.nom)}</td>
          ${p.presence.map(present => `<td class="num">${present ? '<span class="present-tick">✓</span>' : '<span class="absent-dash">—</span>'}</td>`).join('')}
          <td class="num">${p.count}/${sessions.length}</td>
          <td class="num"><strong>${Math.round(p.rate * 100)}%</strong></td>
        </tr>`).join('') || `<tr><td colspan="${sessions.length + 3}" class="empty">Aucun joueur.</td></tr>`}
      </tbody>
    </table></div>
  `;
}

function renderPlayerTable() {
  const players = filteredPlayers().slice().map(p => {
    const teamKeyForPlayer = p.equipe === 'Équipe 1' ? 'eq1' : (p.equipe === 'Équipe 2' ? 'eq2' : null);
    const train = teamKeyForPlayer ? trainingStatsForTeam(p.nom, teamKeyForPlayer) : { count: 0, rate: null };
    return Object.assign({}, p, { trainCount: train.count, trainRate: train.rate });
  });
  const { col, dir } = state.sort;
  players.sort((a, b) => {
    let va = a[col], vb = b[col];
    if (typeof va === 'string') { va = va.toLowerCase(); vb = (vb || '').toLowerCase(); }
    else { va = va || 0; vb = vb || 0; }
    if (va < vb) return dir === 'asc' ? -1 : 1;
    if (va > vb) return dir === 'asc' ? 1 : -1;
    // Départage : nombre de matchs joués, puis temps de jeu
    if (col !== 'matchsJoues' && (a.matchsJoues || 0) !== (b.matchsJoues || 0)) {
      return (b.matchsJoues || 0) - (a.matchsJoues || 0);
    }
    if (col !== 'tempsJeu') {
      return (b.tempsJeu || 0) - (a.tempsJeu || 0);
    }
    return 0;
  });

  const table = document.getElementById('player-table');
  table.innerHTML = `
    <thead><tr>
      ${SORTABLE_COLS.map(c => `<th class="sortable ${c.num?'num':''} ${c.group?'col-'+c.group:''} ${state.sort.col===c.key?'sort-active':''}" data-col="${c.key}">
        ${c.label}${state.sort.col===c.key ? (state.sort.dir==='asc'?' ▲':' ▼') : ''}
      </th>`).join('')}
    </tr></thead>
    <tbody>
      ${players.map(p => `<tr>
        <td>${escapeHtml(p.nom)} <small style="color:var(--ink-soft)">(${escapeHtml(p.equipe)})</small></td>
        <td class="num">${p.matchsJoues}</td>
        <td class="num">${p.tempsJeu}</td>
        <td class="num">${p.buts}</td>
        <td class="num">${p.tete}</td>
        <td class="num">${p.penalty}</td>
        <td class="num">${p.coupFranc}</td>
        <td class="num">${p.passes}</td>
        <td class="num">${p.jaunes}</td>
        <td class="num">${p.rouges}</td>
        <td class="num col-match">${p.tauxConv != null ? Math.round(p.tauxConv*100)+'%' : '—'}</td>
        <td class="num col-train">${p.trainCount}</td>
        <td class="num col-train">${p.trainRate != null ? Math.round(p.trainRate*100)+'%' : '—'}</td>
      </tr>`).join('') || '<tr><td colspan="13" class="empty">Aucun joueur ne correspond à ce filtre.</td></tr>'}
    </tbody>`;

  table.querySelectorAll('th.sortable').forEach(th => {
    th.addEventListener('click', () => {
      const col = th.dataset.col;
      if (state.sort.col === col) state.sort.dir = state.sort.dir === 'asc' ? 'desc' : 'asc';
      else { state.sort.col = col; state.sort.dir = 'desc'; }
      renderPlayerTable();
    });
  });
}

function renderGardienTable() {
  const table = document.getElementById('gardien-table');
  const matchByNum = {};
  state.matches.forEach(m => matchByNum[m.numero] = m);
  const rows = state.gardien.slice().sort((a, b) => b.numero - a.numero);

  table.innerHTML = `
    <thead><tr>
      <th>Date</th><th>Adversaire</th><th>Gardien</th>
      <th class="num">Buts encaissés</th><th>Clean sheet</th>
    </tr></thead>
    <tbody>
      ${rows.length ? rows.map(g => {
        const m = matchByNum[g.numero];
        return `<tr>
          <td>${m ? fmtDate(m.date) : '—'}</td>
          <td>${m ? escapeHtml(m.adversaire || '—') : '—'}</td>
          <td>${escapeHtml(g.gardien || '—')}</td>
          <td class="num">${g.butsEncaisses != null ? g.butsEncaisses : '—'}</td>
          <td>${g.cleanSheet != null && g.cleanSheet !== '' ? escapeHtml(String(g.cleanSheet)) : '—'}</td>
        </tr>`;
      }).join('') : '<tr><td colspan="5" class="empty">Aucune donnée gardien pour l\'instant.</td></tr>'}
    </tbody>`;
}

function renderScorersChart() {
  const top = state.players.filter(p => p.buts > 0).sort((a, b) => b.buts - a.buts).slice(0, 10);
  const ctx = document.getElementById('scorers-chart');
  if (topScorersChart) topScorersChart.destroy();
  if (top.length === 0) {
    ctx.parentElement.innerHTML = '<div class="empty">Aucun but inscrit pour l\'instant.</div>';
    return;
  }
  topScorersChart = new Chart(ctx, {
    type: 'bar',
    data: {
      labels: top.map(p => p.nom),
      datasets: [{ label: 'Buts', data: top.map(p => p.buts), backgroundColor: '#1E5631' }],
    },
    options: {
      indexAxis: 'y',
      responsive: true,
      plugins: { legend: { display: false } },
      scales: {
        x: { beginAtZero: true, ticks: { precision: 0, font: { family: 'Inter' } } },
        y: { ticks: { font: { family: 'Inter', size: 12 } } },
      },
    },
  });
}

function renderAssistsChart() {
  const top = state.players.filter(p => p.passes > 0).sort((a, b) => b.passes - a.passes).slice(0, 10);
  const ctx = document.getElementById('assists-chart');
  if (topAssistsChart) topAssistsChart.destroy();
  if (top.length === 0) {
    ctx.parentElement.innerHTML = '<div class="empty">Aucune passe décisive pour l\'instant.</div>';
    return;
  }
  topAssistsChart = new Chart(ctx, {
    type: 'bar',
    data: {
      labels: top.map(p => p.nom),
      datasets: [{ label: 'Passes décisives', data: top.map(p => p.passes), backgroundColor: '#A93F2B' }],
    },
    options: {
      indexAxis: 'y',
      responsive: true,
      plugins: { legend: { display: false } },
      scales: {
        x: { beginAtZero: true, ticks: { precision: 0, font: { family: 'Inter' } } },
        y: { ticks: { font: { family: 'Inter', size: 12 } } },
      },
    },
  });
}

function renderPlayerPicker() {
  const sel = document.getElementById('player-select');
  const players = state.players.filter(p => p.matchsJoues > 0).sort((a, b) => a.nom.localeCompare(b.nom));
  sel.innerHTML = players.map(p => `<option value="${escapeHtml(p.nom)}">${escapeHtml(p.nom)}</option>`).join('');
  if (players.length > 0) {
    state.selectedPlayer = state.selectedPlayer && players.some(p=>p.nom===state.selectedPlayer) ? state.selectedPlayer : players[0].nom;
    sel.value = state.selectedPlayer;
  }
  sel.addEventListener('change', e => { state.selectedPlayer = e.target.value; renderPlayerCard(); });
  renderPlayerCard();
}

function trainingRateForPlayer(p) {
  const teamKeyForPlayer = p.equipe === 'Équipe 1' ? 'eq1' : (p.equipe === 'Équipe 2' ? 'eq2' : null);
  if (!teamKeyForPlayer) return null;
  const sessions = entrainementsData.sessions.filter(s => s.team === teamKeyForPlayer);
  if (sessions.length === 0) return null;
  const normName = normalizeName(p.nom);
  const entry = entrainementsData.players.find(ep => {
    const n = normalizeName(ep.nom);
    return n.includes(normName) || normName.includes(n);
  });
  if (!entry) return null;
  const count = sessions.filter(s =>
    entrainementsData.sessions.some(s2 => sameDay(s2.date, s.date) && entry.presence[s2.colIndex])
  ).length;
  return count / sessions.length;
}

function renderPlayerCard() {
  const box = document.getElementById('player-card');
  const p = state.players.find(pl => pl.nom === state.selectedPlayer);
  if (!p) { box.innerHTML = '<div class="empty">Aucun joueur sélectionné.</div>'; return; }
  const trainingRate = trainingRateForPlayer(p);
  box.innerHTML = `
    <div class="player-card">
      <h3>${escapeHtml(p.nom)}</h3>
      <div class="team-tag">${escapeHtml(p.equipe)}</div>
      <div class="player-stats">
        <div><div class="num">${p.matchsJoues}</div><small>Matchs joués</small></div>
        <div><div class="num">${p.buts}</div><small>Buts</small></div>
        <div><div class="num">${p.passes}</div><small>Passes déc.</small></div>
        <div><div class="num">${p.jaunes}</div><small>Cartons jaunes</small></div>
        <div><div class="num">${p.rouges}</div><small>Cartons rouges</small></div>
        <div><div class="num">${p.tempsJeu}</div><small>Minutes jouées</small></div>
        <div><div class="num">${p.tempsMoyen}</div><small>Min. / match</small></div>
        <div><div class="num">${p.tauxConv != null ? Math.round(p.tauxConv*100)+'%' : '—'}</div><small>Taux convocation</small></div>
        <div><div class="num">${p.tauxTit != null ? Math.round(p.tauxTit*100)+'%' : '—'}</div><small>Taux titularisation</small></div>
        <div><div class="num">${trainingRate != null ? Math.round(trainingRate*100)+'%' : '—'}</div><small>Participation entraînements</small></div>
      </div>
    </div>`;
}

init();
</script>
